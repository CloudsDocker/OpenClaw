name: Bug Report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: gpu
    attributes:
      label: GPU model
      placeholder: "e.g. NVIDIA RTX 5080 16GB"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Platform
      placeholder: "e.g. WSL2 Ubuntu 24.04 on Windows 11, or Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: "docker --version"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Ollama model
      placeholder: "e.g. ollama/qwen3:14b"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Run: `docker compose logs openclaw | tail -50`"
      render: shell
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up -d`
        2. Open browser to ...
        3. See error
    validations:
      required: true
